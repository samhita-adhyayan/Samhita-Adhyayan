
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caraka Saṃhitā — Sūtrasthāna</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#f7f4ef;
    font-family:'Noto Serif',serif;
    color:#222;
}

.header-box{
    width:1400px;
    max-width:92%;
    margin:30px auto;
    background:#6b001c;
    border:4px solid #d8c08d;
    border-radius:34px;
    text-align:center;
    padding:30px 40px;
    box-shadow:0 12px 28px rgba(0,0,0,0.15);
}

.header-box h1{
    margin:0;
    font-size:clamp(32px,5vw,64px);
    color:#f6ead0;
}

.header-box p{
    margin:12px 0 0;
    font-size:20px;
    font-style:italic;
    color:#f6ead0;
}

.breadcrumb{
    width:92%;
    margin:25px auto;
    color:#666;
}

.breadcrumb a{
    color:#8b0000;
    text-decoration:none;
    font-weight:600;
}

.subtitle{
    text-align:center;
    font-size:clamp(32px,4vw,48px);
    color:#8b0000;
    margin:45px 15px 12px;
}

.subtitle-english{
    text-align:center;
    font-size:20px;
    font-style:italic;
    color:#666;
    margin-bottom:40px;
}

.group{
    width:92%;
    max-width:1500px;
    margin:35px auto;
}

.group-title{
    color:#8b0000;
    font-size:26px;
    border-bottom:2px solid #d8c08d;
    padding-bottom:10px;
    margin-bottom:20px;
}

.chapter-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:20px;
}

.chapter-card{
    background:white;
    border:2px solid #d2b98b;
    border-radius:16px;
    padding:22px 16px;
    min-height:135px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    transition:0.2s;
}

.chapter-card.active{
    cursor:pointer;
}

.chapter-card.active:hover{
    background:#fcf8f2;
    transform:translateY(-4px);
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    border-color:#b89255;
}

.chapter-card h3{
    margin:0 0 12px;
    color:#8b0000;
    font-size:22px;
    line-height:1.6;
}

.chapter-card p{
    margin:0;
    color:#666;
    font-size:15px;
    font-style:italic;
}

.coming-soon{
    margin-top:10px;
    color:#888;
    font-size:12px;
}

.back-link{
    display:block;
    width:max-content;
    margin:40px auto;
    padding:12px 24px;
    border:2px solid #d2b98b;
    border-radius:10px;
    color:#8b0000;
    text-decoration:none;
    background:white;
}

@media(max-width:900px){
    .chapter-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }
}

@media(max-width:600px){
    .chapter-grid{
        grid-template-columns:1fr;
    }

    .header-box{
        padding:25px 15px;
    }

    .group-title{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="header-box">
    <h1>चरकसंहिता</h1>
    <p>Caraka-Saṃhitā</p>
</div>

<div class="breadcrumb">
    <a href="index.html">चरकसंहिता</a>
    &nbsp; › &nbsp; सूत्रस्थानम्
</div>

<h2 class="subtitle">सूत्रस्थानम्</h2>
<div class="subtitle-english">Sūtrasthānam — 30 Chapters</div>

<div id="chapters"></div>

<a class="back-link" href="index.html">← चरकसंहितायाः मुख्यपृष्ठम्</a>

<script>
const groups = [
{
    name:"भेषजचतुष्कम्",
    chapters:[
        ["दीर्घञ्जीवितीयोऽध्यायः","Dīrghañjīvitīya Adhyāya"],
        ["अपामार्गतण्डुलीयोऽध्यायः","Apāmārgataṇḍulīya Adhyāya"],
        ["आरग्वधीयोऽध्यायः","Āragvadhīya Adhyāya"],
        ["षड्विरेचनशताश्रितीयोऽध्यायः","Ṣaḍvirecanaśatāśritīya Adhyāya"]
    ]
},
{
    name:"स्वस्थचतुष्कम्",
    chapters:[
        ["मात्राशितीयोऽध्यायः","Mātrāśitīya Adhyāya"],
        ["तस्याशितीयोऽध्यायः","Tasyāśitīya Adhyāya"],
        ["नवेगान्धारणीयोऽध्यायः","Navegāndhāraṇīya Adhyāya"],
        ["इन्द्रियोपक्रमणीयोऽध्यायः","Indriyopakramanīya Adhyāya"]
    ]
},
{
    name:"निर्देशचतुष्कम्",
    chapters:[
        ["खुड्डाकचतुष्पादोऽध्यायः","Khuddākacatuṣpāda Adhyāya"],
        ["महाचतुष्पादोऽध्यायः","Mahācatuṣpāda Adhyāya"],
        ["तिस्रैषणीयोऽध्यायः","Tistra Eṣaṇīya Adhyāya"],
        ["वातकलाकलीयोऽध्यायः","Vātakalākalīya Adhyāya"]
    ]
},
{
    name:"कल्पनाचतुष्कम्",
    chapters:[
        ["स्नेहाध्यायः","Snehādhyāya"],
        ["स्वेदाध्यायः","Svedādhyāya"],
        ["उपकल्पनीयाध्यायः","Upakalpanīya Adhyāya"],
        ["चिकित्साप्राभृतीयोऽध्यायः","Cikitsāprābhṛtīya Adhyāya"]
    ]
},
{
    name:"रोगचतुष्कम्",
    chapters:[
        ["कियन्तःशिरसीयोऽध्यायः","Kiyantaḥśirasīya Adhyāya"],
        ["त्रिशोथीयोऽध्यायः","Triśothīya Adhyāya"],
        ["अष्टोदरीयोऽध्यायः","Aṣṭodarīya Adhyāya"],
        ["महारोगोऽध्यायः","Mahāroga Adhyāya"]
    ]
},
{
    name:"योजनाचतुष्कम्",
    chapters:[
        ["अष्टौनिन्दितीयोऽध्यायः","Aṣṭau Ninditīya Adhyāya"],
        ["लङ्घनबृंहणीयोऽध्यायः","Laṅghanabṛṃhaṇīya Adhyāya"],
        ["सन्तर्पणीयोऽध्यायः","Santarpaṇīya Adhyāya"],
        ["विधिशोणितीयोऽध्यायः","Vidhiśoṇitīya Adhyāya"]
    ]
},
{
    name:"अन्नपानचतुष्कम्",
    chapters:[
        ["यज्जःपुरुषीयोऽध्यायः","Yajjaḥpuruṣīya Adhyāya"],
        ["आत्रेयभद्रकाप्यीयोऽध्यायः","Ātreyabhadrakāpyīya Adhyāya"],
        ["अन्नपानविध्यध्यायः","Annapānavidhy Adhyāya"],
        ["विविधाशितपीतीयोऽध्यायः","Vividhāśitapītīya Adhyāya"]
    ]
},
{
    name:"संग्रहद्वयम्",
    chapters:[
        ["दशप्राणायतनीयोऽध्यायः","Daśaprāṇāyatanīya Adhyāya"],
        ["अर्थेदशमहामूलीयोऽध्यायः","Arthedaśamahāmūlīya Adhyāya"]
    ]
}
];

const container = document.getElementById("chapters");
let chapterNumber = 1;

groups.forEach(group => {
    const section = document.createElement("section");
    section.className = "group";

    const heading = document.createElement("h3");
    heading.className = "group-title";
    heading.textContent = group.name;
    section.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "chapter-grid";

    group.chapters.forEach(chapter => {
        const number = chapterNumber++;
        const card = document.createElement("div");
        card.className = "chapter-card" + (number === 1 ? " active" : "");

        const title = document.createElement("h3");
        title.textContent = number + ". " + chapter[0];

        const transliteration = document.createElement("p");
        transliteration.textContent = chapter[1];

        card.appendChild(title);
        card.appendChild(transliteration);

        if(number === 1){
            card.addEventListener("click", function(){
                window.location.href = "chapter-01.html";
            });
        } else {
            const status = document.createElement("div");
            status.className = "coming-soon";
            status.textContent = "Coming Soon";
            card.appendChild(status);
        }

        grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
});
</script>

</body>
</html>
